name: build
# Twice a day after the 00Z and 12Z ensembles reach Open-Meteo, and on every push to main: tests, the forecast, the
# feed and site, a kit lint of the feed, then a deploy of site/ to Cloudflare Pages (project vis). Needs repo secrets
# CLOUDFLARE_PAGES_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them everything runs except the deploy.
#
# GitHub starts this account's scheduled runs hours late (gaps up to about 16 hours, 6-8 Nov 2026), so the hub's
# tic-dispatch Worker starts this workflow at 08:25 and 20:25 UTC (hub dispatch/dispatch.js, 8 Nov 2026). The cron
# below is a fallback: the gate job skips a scheduled run when a build succeeded in the last 6 hours, since the
# ensembles only change twice a day and a repeat run would spend Open-Meteo's allowance for nothing.
# A run whose build the gate skipped still ends as "success", so the gate looks for the last run whose build job
# itself succeeded (14 Nov 2026); counting skipped runs let each skip restart the 6-hour window.
#
# Private archive (the last step): every run's history/, its forecast and location files and the deployed site/
# also go to the PRIVATE repo metacog-osint/tic-archive (tools/tic_archive.py), where nothing is replaced or deleted.
# Needs repo secret TIC_ARCHIVE_TOKEN; without it that step fails the run after the live site is updated.
on:
  push:
    branches: [main]
  schedule:
    - cron: "53 8,20 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=""
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?status=success&per_page=20" --jq '.workflow_runs[].id' || true); do
            last=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name == "build" and .conclusion == "success")][0].completed_at // empty' || true)
            [ -n "$last" ] && break
          done
          if [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt 21600 ]; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            echo "A build finished at $last, under 6 hours ago: skipping this run."
          else
            echo "Last successful build: ${last:-none found}. Running."
          fi
  build:
    needs: gate
    if: needs.gate.outputs.skip != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # the archive step uploads release assets (monthly release vis-data-YYYY-MM)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Tests
        run: |
          python tests/test_vis.py
          python tests/test_archive_lanes.py
      - name: Kit copy is intact
        run: python doctrine/kit/tic.py kitcheck
      # The forecast step also reads the GEFS cloud ceiling from NOAA's files on AWS Open Data (tools/gefs.py, about
      # 1.7 GB of byte ranges and 1.5 min of decoding on 4 processes); a failure there leaves the ceiling out.
      - name: Forecast (Open-Meteo ensembles, NOAA GEFS ceiling)
        id: forecast
        run: python tools/forecast.py --days 7
      # Plan step W3 (ideas#246): store METARs append-only, resolve every archived forecast whose UTC day has ended,
      # and score them; the page's "Measured skill" card reads out/verification.json. A failure here leaves the card
      # out of this build and never blocks the deploy. history/metar and history/verify are committed below.
      - name: Verification (METARs, resolve, score)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Each store separately, so one that is missing never leaves the other to be rebuilt from scratch.
          git fetch -q --depth=1 origin main
          for d in history/metar history/verify; do
            git checkout -q FETCH_HEAD -- "$d" 2>/dev/null || echo "No $d on main yet"
          done
          python tools/metar.py --hours 200 || echo "::warning::METAR fetch failed; scoring uses the stored reports"
          mkdir -p "$RUNNER_TEMP/forecasts"
          for t in $(gh release list --limit 4 --json tagName --jq '.[].tagName' | grep '^vis-data-' || true); do
            gh release download "$t" -p '*.forecast.gen-*.json.gz' -D "$RUNNER_TEMP/forecasts" --skip-existing \
              || echo "::warning::could not download $t"
          done
          python tools/verify.py resolve --forecasts "$RUNNER_TEMP/forecasts" && python tools/verify.py score \
            || echo "::warning::verification failed this run"
      # Location detail (22 Nov 2026): per-point forecast, the newest METAR from history/metar (stored by the step
      # above), the current TAF, normals and records for the pop-up. The climate cache comes from release vis-climate
      # (filled by climate.yml); without it the pop-up shows no normals yet. A source that fails is written into the
      # file's errors list, and a failure of the step itself leaves the pop-up without data but never stops the deploy.
      - name: Climate cache from release vis-climate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download vis-climate -p climate.json -D out --clobber || echo "No climate cache yet"
      - name: Location detail (Open-Meteo forecast, METAR store, AWC TAF)
        run: python tools/locations.py || echo "::warning::location detail failed; the pop-up keeps no data this build"
      - name: Feed and site
        run: python tools/build_site.py
      # Contract 2.1: the kit's history log gives each subject its last_change. The log is append-only and lives in
      # history/ on main; a failure here leaves the feed without last_change and never blocks the deploy.
      - name: History (history/, site/data/ended.geojson, last_change in the feed)
        id: history
        run: |
          # Only the kit's own files: a checkout of all of history/ would undo this run's new METAR and score lines.
          git fetch -q --depth=1 origin main && git checkout -q FETCH_HEAD -- history/log history/state.json 2>/dev/null \
            || echo "No history/ on main yet"
          python doctrine/kit/tic.py history site/data/feed.geojson --dir history --ended site/data/ended.geojson \
            --fill-last-change || echo "::warning::history step failed; this run is missing from history/"
      - name: Lint the feed
        run: python doctrine/kit/tic.py lint site/data/feed.geojson
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Deploy site/ to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set; skipping deploy"; exit 0
          fi
          # Cloudflare's API fails now and then with nothing wrong here ("An unknown error occurred ... [code: 8000000]"),
          # which failed the run and mailed an alert. Try three times, 20 s and 60 s apart.
          for wait in 0 20 60; do
            if [ "$wait" != 0 ]; then echo "::warning::Cloudflare deploy failed; trying again in ${wait} s"; sleep "$wait"; fi
            if npx --yes wrangler@4.151.3 pages deploy site --project-name vis --branch main \
                 --commit-hash "$GITHUB_SHA" --commit-message "build $GITHUB_SHA" --commit-dirty=true; then
              exit 0
            fi
          done
          echo "::error::Cloudflare Pages deploy failed three times"; exit 1
      - name: Commit history/
        run: |
          git config user.name "vis-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stamp="history: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git fetch -q --depth=1 origin main && git reset -q --mixed FETCH_HEAD || { sleep $((i * 15)); continue; }
            git add history
            git diff --cached --quiet -- history && { echo "history: nothing new"; exit 0; }
            git commit -q -m "$stamp" && git push -q origin HEAD:main && exit 0
            echo "::warning::history push attempt $i failed"
            sleep $((i * 15))
          done
          echo "::warning::history not committed this run; the next run logs these changes again from the last state"
      # Retention (18 Nov 2026): keep every build's forecast.json (gzipped) in a monthly release. It runs after the
      # deploy, so a failure here never blocks the live site, but it fails the run loudly. Asset names are unique per
      # build (newest model run + build time); no --clobber. The feed is derived from forecast.json, so not archived.
      - name: Archive forecast.json and locations.json to release vis-data-YYYY-MM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          extra=""; [ -f out/locations.json ] && extra="--extra out/locations.json"
          python tools/archive.py prepare out/forecast.json archive $extra > "$RUNNER_TEMP/archive.env"
          cat "$RUNNER_TEMP/archive.env"
          set -a; . "$RUNNER_TEMP/archive.env"; set +a
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" \
            --notes "Per-build archive of Vis forecast.json (gzip). Forecasts from Open-Meteo, CC BY 4.0. Asset name: newest model run (UTC) then build time."
          gh release upload "$tag" "$path"
          echo "Archived $name to $tag"
          if [ -n "${extra_path:-}" ]; then gh release upload "$tag" "$extra_path"; echo "Archived $extra_name to $tag"; fi
      # Private archive: what this public repository keeps only for a while, replaces or may stop publishing also goes
      # to the PRIVATE repo metacog-osint/tic-archive, one lane each (tools/tic_archive.py, release vis-<lane>-YYYY-MM;
      # a snapshot per run, only changed files uploaded, nothing replaced or deleted):
      #   history  history/ as this run left it: the kit's history log and state.json, the METAR store and the
      #            verification stores. Committed to main too. Only when the History step ran, so a run that stopped
      #            earlier never archives an older checkout's history/ as the newest snapshot.
      #   data     this build's forecast.json and locations.json, gzipped by tools/archive.py with the same command as
      #            the step above on the same runner, so the names and bytes are those of the assets on release
      #            vis-data-YYYY-MM. Packed again here rather than taken from that step, so a build whose deploy
      #            failed is kept as well. Only when the forecast step wrote a forecast.
      #   site     site/ as deployed: the page, feed.geojson, ended.geojson, forecast.json, the location files and
      #            verification.json, each replaced by the next deploy. Only when the deploy step succeeded.
      # These files are all public already, so nothing is redacted and the archived bytes match the public copy.
      # Each lane is tried even if another failed; a missing token or any failed lane turns the run red after the live
      # site is updated. Token: TIC_ARCHIVE_TOKEN, contents:write on tic-archive only.
      - name: Private archive (history, forecasts and site, to tic-archive)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.TIC_ARCHIVE_TOKEN }}
          FORECAST: ${{ steps.forecast.outcome }}
          HISTORY: ${{ steps.history.outcome }}
          DEPLOYED: ${{ steps.deploy.outcome }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret TIC_ARCHIVE_TOKEN is not set, so history/, this build's forecast and site/ did not reach the private archive"; exit 1
          fi
          failed=0
          if [ "$HISTORY" = "success" ]; then
            python tools/tic_archive.py put --program vis --lane history --src history || failed=1
          else
            echo "history: the History step did not run, so history/ was not archived"
          fi
          if [ "$FORECAST" = "success" ] && [ -f out/forecast.json ]; then
            extra=""; [ -f out/locations.json ] && extra="--extra out/locations.json"
            python tools/archive.py prepare out/forecast.json "$RUNNER_TEMP/vis-data" $extra \
              && python tools/tic_archive.py put --program vis --lane data --src "$RUNNER_TEMP/vis-data" || failed=1
          else
            echo "data: the forecast step wrote no forecast this run, so there was nothing to archive"
          fi
          if [ "$DEPLOYED" = "success" ]; then
            python tools/tic_archive.py put --program vis --lane site --src site || failed=1
          else
            echo "site: not deployed this run, so not archived"
          fi
          if [ "$failed" != 0 ]; then
            echo "::error::a lane did not reach the private archive this run (see above)"; exit 1
          fi
