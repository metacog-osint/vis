name: climate
# Climate normals and records for the location pop-up (22 Nov 2026). ERA5 daily history per forecast point comes from
# Open-Meteo's Historical API (CC BY 4.0, non-commercial free tier). Each point costs many weighted calls, so this runs
# once a day and fills a few points per run (climate.py --max-points), resuming from the cache it left last time.
# The cache lives as one asset, climate.json, on release vis-climate; build.yml downloads it before each build.
# Once every point is filled, a run only refreshes points whose cache is older than its method or record years.
on:
  schedule:
    - cron: "10 14 * * *"
  workflow_dispatch:
    inputs:
      max_points:
        description: "Points to fill this run"
        default: "4"
permissions:
  contents: read
concurrency:
  group: climate
  cancel-in-progress: false
jobs:
  climate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # uploads release asset vis-climate/climate.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Cache from release vis-climate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          gh release download vis-climate -p climate.json -D out --clobber || echo "No cache yet; starting fresh"
      - name: Fill points (ERA5 via Open-Meteo)
        run: python tools/climate.py --cache out/climate.json --max-points "${{ github.event.inputs.max_points || '4' }}"
      - name: Upload the cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -f out/climate.json ] || { echo "No cache written"; exit 0; }
          gh release view vis-climate >/dev/null 2>&1 || gh release create vis-climate --title "vis-climate" \
            --notes "Climate cache for Vis's location pop-up: 1991-2020 daily normals and records per forecast point, from ERA5 via Open-Meteo's Historical API (CC BY 4.0). Rebuilt by .github/workflows/climate.yml."
          gh release upload vis-climate out/climate.json --clobber
