name: tests
# Runs the same tests as build.yml on every pull request to main, so a PR has a check to read at its head sha.
# No secrets, no deploy, no release writes, and a read-only token.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Tests
        run: |
          python tests/test_vis.py
          python tests/test_archive_lanes.py
      - name: Doctrine and kit copy
        run: python doctrine/kit/tic.py kitcheck
      # Live probes of the location sources (22 Nov 2026). Informational: a network problem never fails the check,
      # but the log shows whether Open-Meteo's forecast and archive APIs and AWC answer as locations.py expects.
      - name: Probe location sources (informational)
        continue-on-error: true
        run: python tools/locations.py --probe
      - name: Probe ERA5 climatology (informational)
        continue-on-error: true
        run: python tools/climate.py --probe
