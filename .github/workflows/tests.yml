name: tests
# Runs the same tests as build.yml on every pull request to main, so a PR has a check to read at its head sha.
# No secrets, no deploy, no release writes, and a read-only token.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Tests
        run: python tests/test_vis.py
      - name: Doctrine and kit copy
        run: python doctrine/kit/tic.py kitcheck
      # Live check of the weather map's layer lookup: prints which layers NASA GIBS and EUMETView list today and
      # which were left out. Informational; it never fails.
      - name: Weather map layers (live, informational)
        run: python tools/wxmap.py --out "$RUNNER_TEMP/wxmap.json" --probe
      # Live check of the jet stream, snow, hail and smoke downloads: prints the GFS run found and what was decoded,
      # and how many hail reports and smoke polygons came back. Informational; it never fails.
      - name: Jet stream, snow, hail and smoke (live, informational)
        run: |
          python -m pip install --quiet eccodes==2.50.1 || echo "eccodes not installed"
          python tools/gfs.py --out "$RUNNER_TEMP/wind250.json" --snow-out "$RUNNER_TEMP/snow.json"
          python tools/wxobs.py --dir "$RUNNER_TEMP"
